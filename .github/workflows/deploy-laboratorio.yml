name: Deploy Laboratorio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-laboratorio.yml'
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm laboratory target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "alyne-crisostomo-laboratorio"' wrangler.jsonc
          if grep -q '"name": "alyne-crisostomo-imoveis"' wrangler.jsonc; then
            echo "Production worker detected. Aborting."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify catalog
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      - name: Deploy only to laboratory worker
        id: deploy
        continue-on-error: true
        run: pnpm exec wrangler deploy

      - name: Record deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cat > .deploy/laboratorio-status.txt <<EOF
          status=${{ steps.deploy.outcome }}
          source_commit=${GITHUB_SHA}
          worker=alyne-crisostomo-laboratorio
          url=https://alyne-crisostomo-laboratorio.grand-crab.workers.dev
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/laboratorio-status.txt
          git commit -m "chore: registrar status do deploy laboratorio" || true
          git push origin HEAD:main

      - name: Fail workflow if deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
