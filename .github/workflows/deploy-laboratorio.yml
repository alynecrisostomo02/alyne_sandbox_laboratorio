name: Deploy Laboratorio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-laboratorio.yml'
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm laboratory target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "alyne-crisostomo-laboratorio"' wrangler.jsonc
          if grep -q '"name": "alyne-crisostomo-imoveis"' wrangler.jsonc; then
            echo "Production worker detected. Aborting."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify catalog
        run: pnpm run verify

      - name: Build
        run: pnpm run build

      - name: Deploy only to laboratory worker
        run: pnpm exec wrangler deploy
